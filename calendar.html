<!-- 密码输入界面 -->

        <div class="password-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h3>Private Calendar</h3>
        <p class="password-hint">Please enter the password to continue</p>
        <input type="password" id="password-input" placeholder="Password" autocomplete="off">
        <button id="password-submit">Enter</button>

<!-- 日历主界面 -->

    <header id="header" style="padding-top: calc(var(--nav-height) + 24px); padding-bottom: 12px;">
        <div class="container">

    <section id="calendar-main">

            <!-- 月视图 -->

                </div>
            </div>

            <!-- 周视图 -->

</div>

</div>

<script>
// ========================================================
//  加密 / 解密 (Web Crypto API — AES-256-GCM + PBKDF2)
// ========================================================
async function deriveKey(password, salt) {
    var keyMaterial = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
    );
}

async function encryptData(jsonStr, password) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var key = await deriveKey(password, salt);
    var encrypted = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(jsonStr)
    );
    var combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
    combined.set(salt, 0);
    combined.set(iv, salt.length);
    combined.set(new Uint8Array(encrypted), salt.length + iv.length);
    // 转 base64
    var b64 = '';
    var chunk = 0x8000;
    for (var i = 0; i < combined.length; i += chunk) {
        b64 += String.fromCharCode.apply(null, combined.subarray(i, i + chunk));
    }
    return btoa(b64);
}

async function decryptData(b64, password) {
    var binary = atob(b64.trim());
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    var salt = bytes.slice(0, 16);
    var iv = bytes.slice(16, 28);
    var ciphertext = bytes.slice(28);
    var key = await deriveKey(password, salt);
    var decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext);
    return new TextDecoder().decode(decrypted);
}

// ========================================================
//  状态
// ========================================================
var currentPassword = '';
var encryptedBlob = '';
var eventsData = [];

// ---- DOM 元素 ----
var passwordScreen = document.getElementById('password-screen');
var calendarApp = document.getElementById('calendar-app');
var passwordInput = document.getElementById('password-input');
var passwordSubmit = document.getElementById('password-submit');
var passwordError = document.getElementById('password-error');

// ---- 加载加密数据 ----
function loadEncrypted(callback) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'calendar.enc?t=' + Date.now(), true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            encryptedBlob = xhr.responseText.trim();
        }
        callback();
    };
    xhr.onerror = function() { callback(); };
    xhr.send();
}

// 页面加载时先拉取密文
loadEncrypted(function() {
    if (sessionStorage.getItem('calendar_authed') === 'yes' && sessionStorage.getItem('calendar_pwd')) {
        tryPassword(sessionStorage.getItem('calendar_pwd'));
    }
});

// ---- 密码验证（通过解密尝试） ----
async function tryPassword(pwd) {
    var pw = pwd || passwordInput.value.trim();
    if (!pw || !encryptedBlob) {
        if (!encryptedBlob) passwordError.textContent = 'Data not loaded yet. Please wait.';
        return;
    }
    passwordSubmit.disabled = true;
    passwordSubmit.textContent = 'Decrypting...';
    try {
        var json = await decryptData(encryptedBlob, pw);
        eventsData = JSON.parse(json);
        currentPassword = pw;
        sessionStorage.setItem('calendar_authed', 'yes');
        sessionStorage.setItem('calendar_pwd', pw);
        showCalendar();
    } catch(e) {
        passwordError.textContent = 'Incorrect password. Please try again.';
        passwordInput.value = '';
        passwordInput.focus();
        var box = document.querySelector('.password-box');
        box.classList.add('shake');
        setTimeout(function() { box.classList.remove('shake'); }, 400);
    }
    passwordSubmit.disabled = false;
    passwordSubmit.textContent = 'Enter';
}

function showCalendar() {
    passwordScreen.style.display = 'none';
    calendarApp.style.display = 'block';
    initCalendar();
}

passwordSubmit.addEventListener('click', function() { tryPassword(); });
passwordInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryPassword();
});

// ---- 主题和导航 ----
(function() {
    var savedTheme = localStorage.getItem('theme');
    var themeToggle = document.querySelector('.theme-toggle');
    if (savedTheme === 'dark') {
        document.body.classList.add('dark');
        var icon = themeToggle ? themeToggle.querySelector('i') : null;
        if (icon) icon.className = 'fas fa-sun';
    }
    if (themeToggle) {
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark');
            var isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            var icon = themeToggle.querySelector('i');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });
    }
    var navbar = document.getElementById('navbar');
    var timer = null;
    window.addEventListener('scroll', function() {
        if (timer) clearTimeout(timer);
        timer = setTimeout(function() {
            navbar.classList.toggle('scrolled', window.scrollY > 10);
        }, 16);
    });
    var navToggle = document.querySelector('.nav-toggle');
    var navLinks = document.querySelector('.nav-links');
    if (navToggle) {
        navToggle.addEventListener('click', function() {
            navLinks.classList.toggle('active');
        });
    }
})();

// ========================================================
//  日历核心
// ========================================================

var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var monthNamesShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var dayNamesShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

var today = new Date();
var viewDate = new Date(today);
var currentView = 'month';

var HOUR_PX = 48;
var SCROLL_HOUR = 7;

// ---- 工具函数 ----
function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(y, m, d) { return y + '-' + pad(m+1) + '-' + pad(d); }
function timeToMinutes(t) {
    if (!t) return 0;
    var parts = t.split(':');
    return parseInt(parts[0]) * 60 + parseInt(parts[1] || 0);
}
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getEventsForDate(dateStr) {
    return eventsData.filter(function(ev) { return ev.date === dateStr; });
}
function getMonday(d) {
    var date = new Date(d);
    var day = date.getDay();
    var diff = date.getDate() - day + (day === 0 ? -6 : 1);
    date.setDate(diff);
    date.setHours(0,0,0,0);
    return date;
}

var calInitialized = false;
function initCalendar() {
    if (calInitialized) { render(); return; }
    calInitialized = true;
    bindControls();
    render();
}

// ---- 渲染入口 ----
function render() {
    updateRangeLabel();
    document.getElementById('month-view').style.display = currentView === 'month' ? 'block' : 'none';
    document.getElementById('week-view').style.display = currentView === 'week' ? 'block' : 'none';
    document.getElementById('day-view').style.display = currentView === 'day' ? 'block' : 'none';
    if (currentView === 'month') renderMonth();
    else if (currentView === 'week') renderWeek();
    else renderDay();
}

function updateRangeLabel() {
    var y = viewDate.getFullYear();
    var m = viewDate.getMonth();
    if (currentView === 'month') {
        document.getElementById('cal-range-label').textContent = monthNames[m] + ' ' + y;
    } else if (currentView === 'week') {
        var ws = getMonday(viewDate);
        var we = new Date(ws); we.setDate(we.getDate() + 6);
        if (ws.getMonth() === we.getMonth()) {
            document.getElementById('cal-range-label').textContent = monthNamesShort[ws.getMonth()] + ' ' + ws.getDate() + ' – ' + we.getDate() + ', ' + we.getFullYear();
        } else {
            document.getElementById('cal-range-label').textContent = monthNamesShort[ws.getMonth()] + ' ' + ws.getDate() + ' – ' + monthNamesShort[we.getMonth()] + ' ' + we.getDate() + ', ' + we.getFullYear();
        }
    } else {
        document.getElementById('cal-range-label').textContent = dayNamesShort[viewDate.getDay()] + ', ' + monthNamesShort[m] + ' ' + viewDate.getDate() + ', ' + y;
    }
}

// ========================================================
//  月视图
// ========================================================
function renderMonth() {
    var grid = document.getElementById('month-grid');
    var y = viewDate.getFullYear();
    var m = viewDate.getMonth();
    var firstDay = new Date(y, m, 1);
    var lastDay = new Date(y, m+1, 0);
    var daysInMonth = lastDay.getDate();
    var startWeekday = firstDay.getDay();
    var prevLast = new Date(y, m, 0).getDate();
    var todayStr = fmtDate(today.getFullYear(), today.getMonth(), today.getDate());

    var html = '';
    for (var i = startWeekday - 1; i >= 0; i--) {
        var d = prevLast - i;
        var ds = fmtDate(m === 0 ? y-1 : y, m === 0 ? 11 : m-1, d);
        html += buildMonthCell(d, ds, true, todayStr);
    }
    for (var j = 1; j <= daysInMonth; j++) {
        var ds2 = fmtDate(y, m, j);
        html += buildMonthCell(j, ds2, false, todayStr);
    }
    var total = startWeekday + daysInMonth;
    var remain = (Math.ceil(total / 7) * 7) - total;
    for (var k = 1; k <= remain; k++) {
        var ds3 = fmtDate(m === 11 ? y+1 : y, m === 11 ? 0 : m+1, k);
        html += buildMonthCell(k, ds3, true, todayStr);
    }

    grid.innerHTML = html;

    grid.querySelectorAll('.cal-event-chip').forEach(function(chip) {
        chip.addEventListener('click', function(e) {
            e.stopPropagation();
            var idx = parseInt(this.getAttribute('data-idx'));
            showEventModal(eventsData[idx]);
        });
    });
    grid.querySelectorAll('.cal-more-link').forEach(function(link) {
        link.addEventListener('click', function(e) {
            e.stopPropagation();
            viewDate = new Date(this.getAttribute('data-date'));
            switchView('day');
        });
    });
}

function buildMonthCell(dayNum, dateStr, otherMonth, todayStr) {
    var dayEvents = getEventsForDate(dateStr);
    var classes = 'cal-month-cell';
    if (otherMonth) classes += ' other-month';
    if (dateStr === todayStr) classes += ' cal-today';

    var chipsHtml = '';
    var sorted = dayEvents.slice().sort(function(a,b) {
        return timeToMinutes(a.time) - timeToMinutes(b.time);
    });
    var maxShow = 3;
    for (var i = 0; i < Math.min(sorted.length, maxShow); i++) {
        var ev = sorted[i];
        var idx = eventsData.indexOf(ev);
        var timeLabel = ev.time ? '<span class="chip-time">' + escapeHtml(ev.time) + '</span> ' : '';
        chipsHtml += '<div class="cal-event-chip" data-idx="' + idx + '">' +
            timeLabel + '<span class="chip-title">' + escapeHtml(ev.title) + '</span></div>';
    }
    if (sorted.length > maxShow) {
        var cellDate = new Date(dateStr);
        chipsHtml += '<span class="cal-more-link" data-date="' + cellDate.toISOString() + '">+' + (sorted.length - maxShow) + ' more</span>';
    }

    return '<div class="' + classes + '" data-date="' + dateStr + '">' +
        '<div class="cal-month-daynum">' + dayNum + '</div>' +
        '<div class="cal-month-events">' + chipsHtml + '</div>' +
        '</div>';
}

// ========================================================
//  时间网格（周视图 & 日视图共用）
// ========================================================
function buildTimeGrid(dayColumns) {
    var colCount = dayColumns.length;
    var timeColWidth = 56;
    var todayStr = fmtDate(today.getFullYear(), today.getMonth(), today.getDate());

    var headerHtml = '<div class="cal-tg-header">' +
        '<div class="cal-tg-corner" style="width:' + timeColWidth + 'px;"></div>';
    dayColumns.forEach(function(col) {
        var isToday = col.dateStr === todayStr;
        headerHtml += '<div class="cal-tg-day-col' + (isToday ? ' today' : '') + '">' +
            '<div class="cal-tg-dayname">' + dayNamesShort[col.date.getDay()] + '</div>' +
            '<div class="cal-tg-daynum' + (isToday ? ' today-num' : '') + '">' + col.date.getDate() + '</div>' +
            '</div>';
    });
    headerHtml += '</div>';

    var bodyHtml = '<div class="cal-tg-scroll">' +
        '<div class="cal-tg-timecol" style="width:' + timeColWidth + 'px;">';
    for (var h = 0; h < 24; h++) {
        var label = h === 0 ? '' : (pad(h) + ':00');
        bodyHtml += '<div class="cal-tg-hour-label" style="height:' + HOUR_PX + 'px">' + label + '</div>';
    }
    bodyHtml += '</div>';

    dayColumns.forEach(function(col) {
        var isToday = col.dateStr === todayStr;
        bodyHtml += '<div class="cal-tg-eventcol' + (isToday ? ' today-col' : '') + '" data-date="' + col.dateStr + '">';

        for (var hh = 0; hh < 24; hh++) {
            bodyHtml += '<div class="cal-tg-hour-line" style="height:' + HOUR_PX + 'px"></div>';
        }

        if (isToday) {
            var nowMin = today.getHours() * 60 + today.getMinutes();
            var topPx = nowMin / 60 * HOUR_PX;
            bodyHtml += '<div class="cal-now-line" style="top:' + topPx + 'px"><span class="cal-now-dot"></span></div>';
        }

        var colEvents = getEventsForDate(col.dateStr).slice().sort(function(a,b) {
            return timeToMinutes(a.time) - timeToMinutes(b.time);
        });
        colEvents.forEach(function(ev) {
            var idx = eventsData.indexOf(ev);
            var startMin = timeToMinutes(ev.time);
            var endMin = ev.endTime ? timeToMinutes(ev.endTime) : startMin + 60;
            if (endMin <= startMin) endMin = startMin + 60;
            var top = startMin / 60 * HOUR_PX;
            var height = Math.max((endMin - startMin) / 60 * HOUR_PX - 2, 20);

            bodyHtml += '<div class="cal-tg-event" data-idx="' + idx + '" style="top:' + top + 'px;height:' + height + 'px;">' +
                '<div class="cal-tg-event-time">' + escapeHtml(ev.time || '') + (ev.endTime ? ' – ' + escapeHtml(ev.endTime) : '') + '</div>' +
                '<div class="cal-tg-event-title">' + escapeHtml(ev.title) + '</div>' +
                (ev.location ? '<div class="cal-tg-event-loc">' + escapeHtml(ev.location) + '</div>' : '') +
                '</div>';
        });

        bodyHtml += '</div>';
    });

    bodyHtml += '</div>';

    var gridStyle = colCount === 1
        ? 'max-width:600px;margin:0 auto;'
        : '';

    return '<div class="cal-tg-wrapper" style="' + gridStyle + '">' + headerHtml + bodyHtml + '</div>';
}

// ========================================================
//  周视图
// ========================================================
function renderWeek() {
    var monday = getMonday(viewDate);
    var cols = [];
    for (var i = 0; i < 7; i++) {
        var d = new Date(monday);
        d.setDate(d.getDate() + i);
        cols.push({ date: d, dateStr: fmtDate(d.getFullYear(), d.getMonth(), d.getDate()) });
    }
    document.getElementById('week-grid').innerHTML = buildTimeGrid(cols);
    bindTimeGridEvents();
    scrollToHour('week-grid');
}

// ========================================================
//  日视图
// ========================================================
function renderDay() {
    var d = new Date(viewDate);
    var cols = [{ date: d, dateStr: fmtDate(d.getFullYear(), d.getMonth(), d.getDate()) }];
    document.getElementById('day-grid').innerHTML = buildTimeGrid(cols);
    bindTimeGridEvents();
    scrollToHour('day-grid');
}

function scrollToHour(containerId) {
    setTimeout(function() {
        var scroll = document.querySelector('#' + containerId + ' .cal-tg-scroll');
        if (scroll) scroll.scrollTop = SCROLL_HOUR * HOUR_PX;
    }, 50);
}

function bindTimeGridEvents() {
    document.querySelectorAll('.cal-tg-event').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            var idx = parseInt(this.getAttribute('data-idx'));
            showEventModal(eventsData[idx]);
        });
    });
}

// ========================================================
//  事件详情弹窗
// ========================================================
function showEventModal(ev) {
    if (!ev) return;
    var body = document.getElementById('event-modal-body');
    var dateParts = ev.date.split('-');
    var dateObj = new Date(parseInt(dateParts[0]), parseInt(dateParts[1])-1, parseInt(dateParts[2]));
    var niceDate = dayNamesShort[dateObj.getDay()] + ', ' + monthNames[dateObj.getMonth()] + ' ' + dateObj.getDate() + ', ' + dateObj.getFullYear();

    body.innerHTML =
        '<div class="cal-modal-title">' + escapeHtml(ev.title) + '</div>' +
        '<div class="cal-modal-date"><i class="far fa-calendar"></i> ' + niceDate + '</div>' +
        (ev.time ? '<div class="cal-modal-time"><i class="far fa-clock"></i> ' + escapeHtml(ev.time) + (ev.endTime ? ' – ' + escapeHtml(ev.endTime) : '') + '</div>' : '') +
        (ev.location ? '<div class="cal-modal-loc"><i class="fas fa-map-marker-alt"></i> ' + escapeHtml(ev.location) + '</div>' : '') +
        (ev.description ? '<div class="cal-modal-desc">' + escapeHtml(ev.description) + '</div>' : '');

    document.getElementById('event-modal').classList.add('active');
}

document.getElementById('event-modal-close').addEventListener('click', function() {
    document.getElementById('event-modal').classList.remove('active');
});
document.getElementById('event-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        document.getElementById('event-modal').classList.remove('active');
        document.getElementById('edit-modal').classList.remove('active');
        document.getElementById('export-modal').classList.remove('active');
    }
});

// ========================================================
//  控件绑定
// ========================================================
function switchView(view) {
    currentView = view;
    document.querySelectorAll('.cal-view-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-view') === view);
    });
    render();
}

function bindControls() {
    document.getElementById('today-btn').onclick = function() {
        viewDate = new Date(today);
        render();
    };
    document.getElementById('prev-btn').onclick = function() { navigate(-1); };
    document.getElementById('next-btn').onclick = function() { navigate(1); };

    document.querySelectorAll('.cal-view-btn').forEach(function(btn) {
        btn.onclick = function() { switchView(this.getAttribute('data-view')); };
    });

    document.getElementById('edit-btn').onclick = function() { showEditModal(); };
}

function navigate(dir) {
    if (currentView === 'month') {
        viewDate.setMonth(viewDate.getMonth() + dir);
    } else if (currentView === 'week') {
        viewDate.setDate(viewDate.getDate() + dir * 7);
    } else {
        viewDate.setDate(viewDate.getDate() + dir);
    }
    render();
}

// ========================================================
//  编辑功能
// ========================================================
function showEditModal() {
    renderEditList();
    document.getElementById('edit-modal').classList.add('active');
}

function renderEditList() {
    var body = document.getElementById('edit-modal-body');
    var sorted = eventsData.slice().sort(function(a, b) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return timeToMinutes(a.time) - timeToMinutes(b.time);
    });

    var listHtml = '<div class="cal-edit-section"><h4>Current Events (' + sorted.length + ')</h4>';
    if (sorted.length === 0) {
        listHtml += '<p class="cal-edit-empty">No events yet.</p>';
    } else {
        sorted.forEach(function(ev) {
            var realIdx = eventsData.indexOf(ev);
            listHtml += '<div class="cal-edit-item">' +
                '<div class="cal-edit-item-info">' +
                    '<span class="cal-edit-item-date">' + escapeHtml(ev.date) + '</span>' +
                    '<span class="cal-edit-item-time">' + escapeHtml(ev.time || '') + (ev.endTime ? '–' + escapeHtml(ev.endTime) : '') + '</span>' +
                    '<span class="cal-edit-item-title">' + escapeHtml(ev.title) + '</span>' +
                    (ev.location ? '<span class="cal-edit-item-loc">' + escapeHtml(ev.location) + '</span>' : '') +
                '</div>' +
                '<button class="cal-edit-delete" data-idx="' + realIdx + '"><i class="fas fa-trash"></i></button>' +
            '</div>';
        });
    }
    listHtml += '</div>';

    // 添加表单
    listHtml += '<div class="cal-edit-section">' +
        '<h4>Add New Event</h4>' +
        '<div class="cal-edit-form">' +
            '<div class="cal-edit-form-row">' +
                '<label>Date <span class="req">*</span></label>' +
                '<input type="date" id="edit-date" placeholder="2026-07-10">' +
            '</div>' +
            '<div class="cal-edit-form-row">' +
                '<label>Title <span class="req">*</span></label>' +
                '<input type="text" id="edit-title" placeholder="e.g. Baidu">' +
            '</div>' +
            '<div class="cal-edit-form-row cal-edit-form-row-2">' +
                '<div><label>Start</label><input type="time" id="edit-time" placeholder="14:00"></div>' +
                '<div><label>End</label><input type="time" id="edit-endtime" placeholder="16:00"></div>' +
            '</div>' +
            '<div class="cal-edit-form-row">' +
                '<label>Location (short)</label>' +
                '<input type="text" id="edit-location" placeholder="e.g. Rongke Center">' +
            '</div>' +
            '<div class="cal-edit-form-row">' +
                '<label>Full Address (shown on click)</label>' +
                '<input type="text" id="edit-description" placeholder="Full address details">' +
            '</div>' +
            '<button id="edit-add-btn" class="cal-edit-add-btn"><i class="fas fa-plus"></i> Add Event</button>' +
        '</div>' +
    '</div>';

    // 导出按钮
    listHtml += '<div class="cal-edit-section">' +
        '<button id="edit-export-btn" class="cal-edit-export-btn"><i class="fas fa-lock"></i> Save &amp; Export Encrypted</button>' +
    '</div>';

    body.innerHTML = listHtml;

    // 绑定删除
    body.querySelectorAll('.cal-edit-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var idx = parseInt(this.getAttribute('data-idx'));
            eventsData.splice(idx, 1);
            renderEditList();
            render();
        });
    });

    // 绑定添加
    document.getElementById('edit-add-btn').addEventListener('click', function() {
        var date = document.getElementById('edit-date').value.trim();
        var title = document.getElementById('edit-title').value.trim();
        if (!date || !title) {
            alert('Date and Title are required.');
            return;
        }
        var newEv = {
            date: date,
            title: title,
            time: document.getElementById('edit-time').value || '',
            endTime: document.getElementById('edit-endtime').value || '',
            location: document.getElementById('edit-location').value.trim(),
            description: document.getElementById('edit-description').value.trim()
        };
        // 清理空字段
        if (!newEv.time) delete newEv.time;
        if (!newEv.endTime) delete newEv.endTime;
        if (!newEv.location) delete newEv.location;
        if (!newEv.description) delete newEv.description;
        eventsData.push(newEv);
        renderEditList();
        render();
    });

    // 绑定导出
    document.getElementById('edit-export-btn').addEventListener('click', exportEncrypted);
}

async function exportEncrypted() {
    var btn = document.getElementById('edit-export-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Encrypting...';
    try {
        var jsonStr = JSON.stringify(eventsData, null, 4);
        var encrypted = await encryptData(jsonStr, currentPassword);
        showExportModal(encrypted);
    } catch(e) {
        alert('Encryption failed: ' + e.message);
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock"></i> Save &amp; Export Encrypted';
}

function showExportModal(encryptedText) {
    var body = document.getElementById('export-modal-body');
    body.innerHTML =
        '<div class="cal-modal-title">Encrypted Data Ready</div>' +
        '<p class="cal-export-hint">Copy the encrypted text below and paste it into <code>calendar.enc</code> in your GitHub repository.</p>' +
        '<textarea id="export-textarea" readonly>' + escapeHtml(encryptedText) + '</textarea>' +
        '<div class="cal-export-actions">' +
            '<button id="export-copy-btn" class="cal-edit-export-btn"><i class="fas fa-copy"></i> Copy All</button>' +
        '</div>';

    document.getElementById('export-modal').classList.add('active');

    document.getElementById('export-copy-btn').addEventListener('click', function() {
        var ta = document.getElementById('export-textarea');
        ta.select();
        ta.setSelectionRange(0, 99999);
        try {
            document.execCommand('copy');
            this.innerHTML = '<i class="fas fa-check"></i> Copied!';
            var self = this;
            setTimeout(function() {
                self.innerHTML = '<i class="fas fa-copy"></i> Copy All';
            }, 2000);
        } catch(e) {
            alert('Press Ctrl+C to copy.');
        }
    });
}

document.getElementById('edit-modal-close').addEventListener('click', function() {
    document.getElementById('edit-modal').classList.remove('active');
});
document.getElementById('edit-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
});
document.getElementById('export-modal-close').addEventListener('click', function() {
    document.getElementById('export-modal').classList.remove('active');
});
document.getElementById('export-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
});
</script>
