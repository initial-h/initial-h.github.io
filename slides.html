<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Colorization - Slides</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .slides-container {
            max-width: 1200px;
            margin: 80px auto 40px;
            padding: 20px;
            text-align: center;
        }
        .slides-header {
            margin-bottom: 30px;
        }
        .slides-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .slides-header p {
            color: var(--color-text-secondary);
        }
        .pdf-viewer {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }
        .pdf-viewer iframe {
            width: 100%;
            height: 800px;
            border: none;
            display: block;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--color-accent);
            text-decoration: none;
            font-size: 1.1rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .pdf-viewer iframe {
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Hongming Zhang</a>
            <div class="nav-toggle"><i class="fas fa-bars"></i></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="applications.html">Applications</a>
                <a href="publications.html">Publications</a>
                <a href="services.html">Services</a>
                <a href="misc.html">Misc</a>
                <button class="theme-toggle"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <div class="slides-container">
        <div class="slides-header">
            <h1>Automatic Colorization</h1>
            <p>Project Presentation Slides</p>
        </div>

        <div class="pdf-viewer">
            <iframe
                src="images/colorization_slides/slides.pdf"
                title="Automatic Colorization Slides PDF"
                type="application/pdf"
            >
                <p>Your browser does not support PDFs. 
                   <a href="images/colorization_slides/slides.pdf">Download the PDF</a>.
                </p>
            </iframe>
        </div>

        <a href="applications.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Applications
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
    <script src="script.js"></script>
</body>
</html>
