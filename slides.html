<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Colorization - Slides</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .slides-container {
            max-width: 1200px;
            margin: 80px auto 40px;
            padding: 20px;
            text-align: center;
        }
        .slides-header {
            margin-bottom: 30px;
        }
        .slides-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .slides-header p {
            color: var(--color-text-secondary);
        }
        .pdf-viewer {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }
        .pdf-viewer iframe {
            width: 100%;
            height: 800px;
            border: none;
            display: block;
        }
        .viewer-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }
        .fullscreen-btn {
            background: var(--color-accent, #2563eb);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s ease;
        }
        .fullscreen-btn:hover {
            opacity: 0.85;
        }
        /* Fullscreen state: wrapper fills screen, toolbar stays, iframe fills rest */
        .viewer-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
        }
        .viewer-wrapper:fullscreen .viewer-toolbar {
            flex-shrink: 0;
            padding: 10px 16px;
            margin-bottom: 0;
        }
        .viewer-wrapper:fullscreen .pdf-viewer {
            flex: 1;
            min-height: 0;
            border-radius: 0;
            box-shadow: none;
            margin-bottom: 0;
            display: flex;
        }
        .viewer-wrapper:fullscreen .pdf-viewer iframe {
            width: 100%;
            height: 100%;
        }
        .viewer-wrapper:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
        }
        .viewer-wrapper:-webkit-full-screen .viewer-toolbar {
            flex-shrink: 0;
            padding: 10px 16px;
            margin-bottom: 0;
        }
        .viewer-wrapper:-webkit-full-screen .pdf-viewer {
            flex: 1;
            min-height: 0;
            border-radius: 0;
            box-shadow: none;
            margin-bottom: 0;
            display: flex;
        }
        .viewer-wrapper:-webkit-full-screen .pdf-viewer iframe {
            width: 100%;
            height: 100%;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--color-accent);
            text-decoration: none;
            font-size: 1.1rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .pdf-viewer iframe {
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Hongming Zhang</a>
            <div class="nav-toggle"><i class="fas fa-bars"></i></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="applications.html">Applications</a>
                <a href="publications.html">Publications</a>
                <a href="services.html">Services</a>
                <a href="misc.html">Misc</a>
                <button class="theme-toggle"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <div class="slides-container">
        <div class="slides-header">
            <h1>Automatic Colorization</h1>
            <p>Project Presentation Slides</p>
        </div>

        <div class="viewer-wrapper" id="viewerWrapper">
            <div class="viewer-toolbar">
                <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Toggle fullscreen">
                    <i class="fas fa-expand"></i> <span>Fullscreen</span>
                </button>
            </div>

            <div class="pdf-viewer">
                <iframe
                    src="images/colorization_slides/slides.pdf"
                    title="Automatic Colorization Slides PDF"
                    type="application/pdf"
                >
                    <p>Your browser does not support PDFs. 
                       <a href="images/colorization_slides/slides.pdf">Download the PDF</a>.
                    </p>
                </iframe>
            </div>
        </div>

        <a href="applications.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Applications
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
    <script src="script.js"></script>
    <script>
        (function () {
            var viewer = document.getElementById('viewerWrapper');
            var btn = document.getElementById('fullscreenBtn');
            var icon = btn.querySelector('i');
            var label = btn.querySelector('span');

            function isFullscreen() {
                return document.fullscreenElement || document.webkitFullscreenElement;
            }

            function updateBtn() {
                if (isFullscreen()) {
                    icon.className = 'fas fa-compress';
                    label.textContent = 'Exit';
                } else {
                    icon.className = 'fas fa-expand';
                    label.textContent = 'Fullscreen';
                }
            }

            btn.addEventListener('click', function () {
                if (isFullscreen()) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } else {
                    if (viewer.requestFullscreen) viewer.requestFullscreen();
                    else if (viewer.webkitRequestFullscreen) viewer.webkitRequestFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', updateBtn);
            document.addEventListener('webkitfullscreenchange', updateBtn);
        })();
    </script>
</body>
</html>
